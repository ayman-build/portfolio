<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio · edit</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- style.css (embedded) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0b1a33;
      padding: 1.5rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1050px;
      margin: 0 auto;
      background: white;
      border-radius: 2rem;
      padding: 2rem 2rem 1.5rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.03);
    }

    /* ----- edit panel ----- */
    .edit-panel {
      background: #f1f5f9;
      border-radius: 1.8rem;
      padding: 1.5rem 1.8rem;
      margin-bottom: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1.2rem 1.8rem;
      border: 1px solid #e2e8f0;
    }

    .edit-panel .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1 0 140px;
    }

    .edit-panel label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #1e293b;
    }

    .edit-panel input,
    .edit-panel textarea {
      font: inherit;
      padding: 0.5rem 0.8rem;
      border: 1px solid #d1d9e6;
      border-radius: 1.8rem;
      background: white;
      transition: 0.2s;
      width: 100%;
    }

    .edit-panel input:focus,
    .edit-panel textarea:focus {
      outline: 2px solid #2563eb;
      border-color: transparent;
    }

    .edit-panel textarea {
      border-radius: 1.2rem;
      resize: vertical;
      min-height: 2.8rem;
    }

    .avatar-upload {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .avatar-upload input[type="file"] {
      border: none;
      padding: 0.3rem 0;
      background: transparent;
      width: auto;
      font-size: 0.8rem;
    }

    .avatar-preview {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #d9e2ef;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2563eb;
      font-size: 1.6rem;
      overflow: hidden;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      flex-shrink: 0;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .save-area {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-left: auto;
      flex-wrap: wrap;
    }

    .btn-save {
      background: #2563eb;
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.5rem 1.6rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 8px rgba(37,99,235,0.15);
    }

    .btn-save:hover {
      background: #1d4ed8;
      transform: scale(0.97);
    }

    .save-feedback {
      color: #2563eb;
      font-weight: 500;
      font-size: 0.9rem;
      min-width: 3.5rem;
      opacity: 0;
      transition: 0.2s;
    }

    .save-feedback.show {
      opacity: 1;
    }

    /* ----- navigation ----- */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.2rem 0 1.2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .logo span {
      color: #2563eb;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      font-weight: 500;
    }

    .nav-links a {
      text-decoration: none;
      color: #1e293b;
      transition: 0.2s;
      border-bottom: 2px solid transparent;
      padding-bottom: 0.2rem;
    }

    .nav-links a:hover {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    /* ----- hero ----- */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2rem 3rem;
      padding: 1.5rem 0 2.5rem;
    }

    .hero-content {
      flex: 2 1 280px;
    }

    .badge {
      background: #dbeafe;
      color: #1d4ed8;
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      margin-bottom: 0.6rem;
    }

    .hero-content h1 {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .hero-content h1 .accent-name {
      color: #2563eb;
    }

    .hero-content p {
      color: #334155;
      max-width: 460px;
      margin: 0.6rem 0 1.4rem;
      font-size: 1.05rem;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.8rem;
      border-radius: 2rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 4px 10px rgba(37,99,235,0.2);
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn-outline {
      border-color: #cbd5e1;
      color: #1e293b;
    }

    .btn-outline:hover {
      border-color: #2563eb;
      color: #2563eb;
      background: #f8fafc;
    }

    /* profile photo (hero) */
    .hero-avatar {
      flex: 0 0 130px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #e9eef3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      color: #2563eb;
      overflow: hidden;
      border: 4px solid white;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .hero-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ----- projects grid ----- */
    .section-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin: 2.5rem 0 1.5rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.8rem;
    }

    .project-card {
      background: #f8fafc;
      border-radius: 1.8rem;
      padding: 1.8rem 1.5rem 1.5rem;
      transition: 0.25s ease;
      border: 1px solid #edf2f7;
      box-shadow: 0 4px 8px rgba(0,0,0,0.01);
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 30px rgba(0,0,0,0.06);
      border-color: #dbeafe;
    }

    .project-card .card-icon {
      font-size: 2rem;
      color: #2563eb;
      margin-bottom: 0.4rem;
    }

    .project-card h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .project-card p {
      color: #475569;
      font-size: 0.95rem;
      margin: 0.3rem 0 0.5rem;
    }

    .project-card .tag {
      background: #e2e8f0;
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.9rem;
      border-radius: 2rem;
      color: #1e293b;
      letter-spacing: 0.02em;
    }

    [contenteditable="true"] {
      outline: none;
      transition: background 0.1s;
      border-radius: 0.3rem;
      padding: 0 0.1rem;
    }
    [contenteditable="true"]:hover {
      background: #eef2ff;
    }
    [contenteditable="true"]:focus {
      background: #e0e7ff;
    }

    /* ----- contact section ----- */
    .contact-links {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem 2.8rem;
      padding: 0.5rem 0 0.8rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.1rem;
    }

    .contact-item i {
      color: #2563eb;
      width: 1.8rem;
      font-size: 1.5rem;
    }

    .contact-item [contenteditable="true"] {
      min-width: 100px;
      border-bottom: 1px dashed #cbd5e1;
      padding: 0.1rem 0.2rem;
    }

    /* footer */
    .footer {
      margin-top: 3rem;
      border-top: 1px solid #e9edf3;
      padding-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.8rem;
      font-size: 0.9rem;
      color: #64748b;
    }

    .footer [contenteditable="true"] {
      border-bottom: 1px dashed #b9c7da;
      padding: 0 0.2rem;
    }

    /* responsive */
    @media (max-width: 650px) {
      .container { padding: 1.2rem; }
      .edit-panel { flex-direction: column; align-items: stretch; }
      .save-area { margin-left: 0; justify-content: flex-end; }
      .hero { flex-direction: column-reverse; text-align: center; }
      .hero-content p { max-width: 100%; }
      .hero-buttons { justify-content: center; }
      .hero-avatar { flex: 0 0 120px; width: 120px; height: 120px; }
      .nav-links { gap: 1.2rem; }
      .contact-links { flex-direction: column; gap: 0.8rem; }
    }
  </style>
</head>
<body>
<div class="container" id="app">

  <!-- EDIT PANEL -->
  <div class="edit-panel">
    <div class="field avatar-upload">
      <label>Profile photo</label>
      <input type="file" id="avatarInput" accept="image/*">
      <div class="avatar-preview" id="avatarPreview">
        <i class="fas fa-user"></i>
      </div>
    </div>
    <div class="field">
      <label>Name</label>
      <input type="text" id="nameInput" placeholder="Your name" value="Alex Rivera">
    </div>
    <div class="field">
      <label>Bio</label>
      <textarea id="bioInput" rows="1" placeholder="Short bio...">Crafting interfaces with curiosity &amp; clarity.</textarea>
    </div>
    <div class="save-area">
      <button class="btn-save" id="saveBtn"><i class="fas fa-save" style="margin-right:6px;"></i>Save</button>
      <span class="save-feedback" id="saveFeedback">Saved!</span>
    </div>
  </div>

  <!-- NAV -->
  <nav>
    <div class="logo">Port<span>folio</span></div>
    <div class="nav-links">
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <div class="badge"><i class="fas fa-code" style="margin-right:4px;"></i> front-end dev</div>
      <h1>Hi, I'm <span class="accent-name" id="heroNameDisplay">Alex Rivera</span></h1>
      <p id="heroBioDisplay">Crafting interfaces with curiosity &amp; clarity.</p>
      <div class="hero-buttons">
        <a href="#projects" class="btn btn-primary">See work</a>
        <a href="#contact" class="btn btn-outline">Contact</a>
      </div>
    </div>
    <div class="hero-avatar" id="heroAvatar">
      <i class="fas fa-user"></i>
    </div>
  </section>

  <!-- PROJECTS -->
  <h2 class="section-title" id="projects">Projects</h2>
  <div class="projects-grid" id="projectsGrid">
    <!-- cards are generated by JS -->
  </div>

  <!-- CONTACT -->
  <h2 class="section-title" id="contact">Contact</h2>
  <div class="contact-links" id="contactLinks">
    <!-- generated by JS -->
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span>built with HTML &amp; CSS · <span contenteditable="true" id="yearEdit">2026</span></span>
    <span><i class="fas fa-code" style="color:#2563eb;"></i>  always learning</span>
  </footer>
</div>

<script>
  (function() {
    // ----- DOM refs -----
    const avatarInput = document.getElementById('avatarInput');
    const avatarPreview = document.getElementById('avatarPreview');
    const heroAvatar = document.getElementById('heroAvatar');
    const nameInput = document.getElementById('nameInput');
    const bioInput = document.getElementById('bioInput');
    const heroNameDisplay = document.getElementById('heroNameDisplay');
    const heroBioDisplay = document.getElementById('heroBioDisplay');
    const saveBtn = document.getElementById('saveBtn');
    const saveFeedback = document.getElementById('saveFeedback');
    const projectsGrid = document.getElementById('projectsGrid');
    const contactLinks = document.getElementById('contactLinks');
    const yearEdit = document.getElementById('yearEdit');

    // ----- default data -----
    const DEFAULT_PROJECTS = [
      { icon: 'fa-layer-group', title: 'Design System', desc: 'Component library with 40+ UI blocks', tag: 'React' },
      { icon: 'fa-chart-line', title: 'Analytics Dash', desc: 'Real-time data visualisation', tag: 'Vue' },
      { icon: 'fa-mobile-screen', title: 'Pocket Weather', desc: 'Minimalist weather app with geolocation', tag: 'JS' }
    ];

    const DEFAULT_CONTACTS = [
      { icon: 'fa-envelope', label: 'email', value: 'alex@dev.me' },
      { icon: 'fa-github', label: 'github', value: 'alex-dev' },
      { icon: 'fa-linkedin', label: 'linkedin', value: 'alexrivera' },
      { icon: 'fa-twitter', label: 'twitter', value: '@alex_codes' }
    ];

    // ----- load from localStorage or fallback -----
    let storedAvatar = localStorage.getItem('portfolio_avatar') || '';
    let storedName = localStorage.getItem('portfolio_name') || 'Alex Rivera';
    let storedBio = localStorage.getItem('portfolio_bio') || 'Crafting interfaces with curiosity &amp; clarity.';
    let storedProjects = localStorage.getItem('portfolio_projects');
    let storedContacts = localStorage.getItem('portfolio_contacts');
    let storedYear = localStorage.getItem('portfolio_year') || '2026';

    let projects = storedProjects ? JSON.parse(storedProjects) : DEFAULT_PROJECTS;
    let contacts = storedContacts ? JSON.parse(storedContacts) : DEFAULT_CONTACTS;

    // ----- apply stored data to UI -----
    function applyAll() {
      // name & bio
      nameInput.value = storedName;
      bioInput.value = storedBio;
      heroNameDisplay.textContent = storedName;
      heroBioDisplay.textContent = storedBio;

      // avatar
      if (storedAvatar && storedAvatar.startsWith('data:image')) {
        const img = document.createElement('img');
        img.src = storedAvatar;
        avatarPreview.innerHTML = '';
        avatarPreview.appendChild(img);
        heroAvatar.innerHTML = '';
        heroAvatar.appendChild(img.cloneNode());
      } else {
        avatarPreview.innerHTML = '<i class="fas fa-user"></i>';
        heroAvatar.innerHTML = '<i class="fas fa-user"></i>';
      }

      // projects
      renderProjects(projects);
      // contacts
      renderContacts(contacts);
      // year
      yearEdit.textContent = storedYear;
    }

    // ----- render projects -----
    function renderProjects(projList) {
      projectsGrid.innerHTML = '';
      projList.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.dataset.index = idx;
        card.innerHTML = `
          <div class="card-icon"><i class="fas ${p.icon || 'fa-cube'}"></i></div>
          <h3 contenteditable="true" class="proj-title">${p.title || 'Project'}</h3>
          <p contenteditable="true" class="proj-desc">${p.desc || 'Description'}</p>
          <span class="tag" contenteditable="true" class="proj-tag">${p.tag || 'tag'}</span>
        `;
        projectsGrid.appendChild(card);
      });
    }

    // ----- render contacts -----
    function renderContacts(contactList) {
      contactLinks.innerHTML = '';
      contactList.forEach((c, idx) => {
        const div = document.createElement('div');
        div.className = 'contact-item';
        div.dataset.index = idx;
        div.innerHTML = `
          <i class="fas ${c.icon || 'fa-link'}"></i>
          <span contenteditable="true" class="contact-value">${c.value || ''}</span>
        `;
        contactLinks.appendChild(div);
      });
    }

    // ----- collect data from UI -----
    function collectFromUI() {
      // name, bio
      const name = nameInput.value.trim() || 'Alex Rivera';
      const bio = bioInput.value.trim() || 'Crafting interfaces with curiosity & clarity.';
      // projects
      const cards = document.querySelectorAll('.project-card');
      const newProjects = [];
      cards.forEach(card => {
        const iconEl = card.querySelector('.card-icon i');
        const icon = iconEl ? iconEl.className.replace('fas ', '') : 'fa-cube';
        const title = card.querySelector('.proj-title')?.textContent?.trim() || 'Project';
        const desc = card.querySelector('.proj-desc')?.textContent?.trim() || 'Description';
        const tag = card.querySelector('.proj-tag')?.textContent?.trim() || 'tag';
        newProjects.push({ icon, title, desc, tag });
      });
      // contacts
      const items = document.querySelectorAll('.contact-item');
      const newContacts = [];
      items.forEach(item => {
        const iconEl = item.querySelector('i');
        const icon = iconEl ? iconEl.className.replace('fas ', '') : 'fa-link';
        const value = item.querySelector('.contact-value')?.textContent?.trim() || '';
        // label from icon fallback
        let label = 'link';
        if (icon.includes('envelope')) label = 'email';
        else if (icon.includes('github')) label = 'github';
        else if (icon.includes('linkedin')) label = 'linkedin';
        else if (icon.includes('twitter')) label = 'twitter';
        newContacts.push({ icon, label, value });
      });
      // year
      const year = yearEdit.textContent.trim() || '2026';

      return { name, bio, projects: newProjects, contacts: newContacts, year };
    }

    // ----- save all to localStorage -----
    function saveAll() {
      const { name, bio, projects: p, contacts: c, year } = collectFromUI();

      // avatar (from preview)
      const previewImg = avatarPreview.querySelector('img');
      let avatarData = storedAvatar; // keep if no new image
      if (previewImg && previewImg.src && previewImg.src.startsWith('data:image')) {
        avatarData = previewImg.src;
      } else if (!previewImg && storedAvatar && storedAvatar.startsWith('data:image')) {
        // keep existing
      } else {
        avatarData = '';
      }

      localStorage.setItem('portfolio_avatar', avatarData);
      localStorage.setItem('portfolio_name', name);
      localStorage.setItem('portfolio_bio', bio);
      localStorage.setItem('portfolio_projects', JSON.stringify(p));
      localStorage.setItem('portfolio_contacts', JSON.stringify(c));
      localStorage.setItem('portfolio_year', year);

      // update hero
      heroNameDisplay.textContent = name;
      heroBioDisplay.textContent = bio;
      // update avatar hero
      if (avatarData && avatarData.startsWith('data:image')) {
        const img = document.createElement('img');
        img.src = avatarData;
        heroAvatar.innerHTML = '';
        heroAvatar.appendChild(img);
      } else {
        heroAvatar.innerHTML = '<i class="fas fa-user"></i>';
      }

      // update stored variables
      storedName = name;
      storedBio = bio;
      storedAvatar = avatarData;
      projects = p;
      contacts = c;

      // feedback
      saveFeedback.classList.add('show');
      setTimeout(() => saveFeedback.classList.remove('show'), 1700);
    }

    // ----- avatar upload handler -----
    avatarInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const dataUrl = ev.target.result;
        // preview (edit panel)
        avatarPreview.innerHTML = `<img src="${dataUrl}" alt="avatar">`;
        // hero preview (live)
        heroAvatar.innerHTML = `<img src="${dataUrl}" alt="avatar">`;
        storedAvatar = dataUrl; // keep for save
        // auto-save? we'll save on button click
      };
      reader.readAsDataURL(file);
    });

    // ----- save button -----
    saveBtn.addEventListener('click', saveAll);

    // ----- ensure contenteditable changes are reflected on save (they are collected) -----

    // ----- initial apply -----
    applyAll();

    // small fix: if no avatar, ensure hero shows user icon
    if (!storedAvatar || !storedAvatar.startsWith('data:image')) {
      heroAvatar.innerHTML = '<i class="fas fa-user"></i>';
    }

    // sync year edit
    yearEdit.addEventListener('blur', function() {
      // just save on blur? we rely on save button. but we keep year in localStorage via save.
      // but if user edits year and clicks save, it's collected.
    });

    // extra: if user edits projects/contacts directly, save button will collect.
    // we also listen to blur on contenteditables to update internal projects? 
    // but we collect all on save.

    console.log('✨ Portfolio ready — edit & save!');
  })();
</script>
</body>
</html>
